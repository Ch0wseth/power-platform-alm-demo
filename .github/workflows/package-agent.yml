name: Package Release Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/stabilize_solution_prefix.py"
      - ".github/workflows/package-agent.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build importable solution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Package Copilot Studio source
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes copilot pack
          --publisher-prefix ppdemo
          --project-dir agent
          --output-path out/raw
          --solution-name ppdemo_ReleaseRadar

      - name: Unpack solution for stable publisher metadata
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes solution unpack
          --zipfile out/raw/ppdemo_ReleaseRadar.zip
          --folder out/unpacked
          --packagetype Unmanaged

      - name: Set stable publisher option-value prefix
        run: python3 scripts/stabilize_solution_prefix.py out/unpacked/Other/Solution.xml

      - name: Repack importable solution
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes solution pack
          --zipfile out/ppdemo_ReleaseRadar.zip
          --folder out/unpacked
          --packagetype Unmanaged

      - name: Upload importable solution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-radar-solution
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
