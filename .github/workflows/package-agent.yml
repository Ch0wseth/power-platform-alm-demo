name: Package Release Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/package-agent.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Package Copilot Studio agent
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes copilot pack
          --publisher-prefix ppdemo
          --project-dir agent
          --output-path out
          --solution-name ppdemo_ReleaseRadar

      - name: Upload importable solution
        uses: actions/upload-artifact@v4
        with:
          name: release-radar-solution
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
