name: Package Travel Concierge

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build importable solution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run standard-library tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Package Copilot Studio source
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes copilot pack
          --publisher-prefix ppdemo
          --project-dir agent
          --output-path out/raw
          --solution-name ppdemo_ReleaseRadar

      - name: Unpack solution for stable publisher metadata
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes solution unpack
          --zipfile out/raw/ppdemo_ReleaseRadar.zip
          --folder out/unpacked
          --packagetype Unmanaged

      - name: Set stable publisher option-value prefix
        run: python3 scripts/stabilize_solution_prefix.py out/unpacked/Other/Solution.xml

      - name: Repack importable solution
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes solution pack
          --zipfile out/ppdemo_ReleaseRadar.zip
          --folder out/unpacked
          --packagetype Unmanaged

      - name: Upload importable solution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-radar-solution
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
