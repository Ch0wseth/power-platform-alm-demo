name: Export validated GitHub Harness agent from test

on:
  workflow_dispatch:
    inputs:
      source_harness_verified:
        description: I checked the GitHub Copilot Harness, dependencies, settings and acceptance cases in TEST; this demo contains synthetic content only
        type: boolean
        required: true
        default: false

concurrency:
  group: release-radar-copilot-studio-test
  cancel-in-progress: false

permissions: {}

jobs:
  export:
    name: Export managed harness solution from TEST
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: copilot-studio-test
    permissions:
      contents: read
      id-token: write
    env:
      PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
      PP_APPLICATION_ID: ${{ secrets.PP_APPLICATION_ID }}
      PP_ENVIRONMENT_ID: ${{ secrets.PP_ENVIRONMENT_ID }}
      PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
      HARNESS_AGENT_SCHEMA: ${{ vars.HARNESS_AGENT_SCHEMA }}
      SOURCE_HARNESS_VERIFIED: ${{ inputs.source_harness_verified }}
    steps:
      - name: Check out release validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check source configuration and attestation
        run: |
          set -euo pipefail
          python3 scripts/harness_release.py source-config
          mkdir -p release

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install Microsoft Power Platform actions tools
        id: tools
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          add-tools-to-path: true

      - name: Verify source environment
        id: identity
        uses: microsoft/powerplatform-actions/who-am-i@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APPLICATION_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      - name: Check source environment matches configuration
        env:
          ACTUAL_ENVIRONMENT_ID: ${{ steps.identity.outputs.environment-id }}
        run: python3 scripts/harness_release.py identity

      - name: Export managed harness solution
        uses: microsoft/powerplatform-actions/export-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b # v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APPLICATION_ID }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ppdemo_HarnessReleaseAdvisor
          solution-output-file: release/ppdemo_HarnessReleaseAdvisor_managed.zip
          managed: true
          run-asynchronously: true
          max-async-wait-time: 30

      - name: Seal managed payload
        run: python3 scripts/harness_release.py seal

      - name: Upload managed export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-export-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 3

      - name: Remove runner authentication profile
        if: always() && steps.tools.outcome == 'success'
        run: pac auth clear
