name: Export validated GitHub Harness agent from test

on:
  workflow_dispatch:
    inputs:
      source_harness_verified:
        description: I checked the GitHub Copilot Harness, dependencies, settings and acceptance cases in TEST; this demo contains synthetic content only
        type: boolean
        required: true
        default: false

concurrency:
  group: release-radar-copilot-studio-test
  cancel-in-progress: false

permissions: {}

jobs:
  export:
    name: Export managed harness solution from TEST
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: copilot-studio-test
    permissions:
      contents: read
      id-token: write
    env:
      PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
      PP_APPLICATION_ID: ${{ secrets.PP_APPLICATION_ID }}
      PP_ENVIRONMENT_ID: ${{ secrets.PP_ENVIRONMENT_ID }}
      PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
      HARNESS_AGENT_SCHEMA: ${{ vars.HARNESS_AGENT_SCHEMA }}
      SOURCE_HARNESS_VERIFIED: ${{ inputs.source_harness_verified }}
    steps:
      - name: Check out release validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check source configuration and attestation
        run: |
          set -euo pipefail
          python3 scripts/harness_release.py source-config
          mkdir -p release

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate to TEST using GitHub OIDC
        id: authenticate
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes auth create
          --name harness-test --githubFederated
          --tenant "$PP_TENANT_ID"
          --applicationId "$PP_APPLICATION_ID"
          --environment "$PP_ENVIRONMENT_URL"

      - name: Verify source environment
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes org who
          --environment "$PP_ENVIRONMENT_ID"

      - name: Export managed harness solution
        run: >-
          dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes solution export
          --environment "$PP_ENVIRONMENT_ID"
          --name ppdemo_HarnessReleaseAdvisor
          --path release/ppdemo_HarnessReleaseAdvisor_managed.zip
          --managed true --async --max-async-wait-time 30

      - name: Seal managed payload
        run: python3 scripts/harness_release.py seal

      - name: Upload managed export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-export-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 3

      - name: Remove runner authentication profile
        if: always() && (steps.authenticate.outcome == 'success' || steps.authenticate.outcome == 'failure')
        run: dnx Microsoft.PowerApps.CLI.Tool@2.13.1 --yes auth clear
