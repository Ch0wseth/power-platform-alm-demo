mcs.metadata:
  componentName: Greeting
  description: This topic is triggered when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - "Welcome to Travel Concierge! Let's try a three-day city break in Lisbon, Rome, or Barcelona: pick a destination, set a budget, and get a sample itinerary with a calculated cost. All prices are fictional; nothing can be booked. Say 'Plan a city break' to start."
        speak:
          - Welcome to Travel Concierge. Say plan a city break to start a fictional travel proposal.

    - kind: CancelAllDialogs
      id: cancelAllDialogs_01At22