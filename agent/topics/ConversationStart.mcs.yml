mcs.metadata:
  componentName: Conversation Start
  description: This system topic triggers when the agent receives an Activity indicating the beginning of a new conversation. If you do not want the agent to initiate the conversation, disable this topic.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - "Welcome to {System.Bot.Name}! Fancy a city break? Try 'Plan a city break' for a guided three-day trip to Lisbon, Rome, or Barcelona, or ask 'Can you book it?' to explore the demo's limits. Sample prices only: no live availability, reservations, or payments."
        speak:
          - "Welcome to {System.Bot.Name}. Say plan a city break. All prices are fictional and no booking will be made."